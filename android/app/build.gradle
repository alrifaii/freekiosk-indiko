apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


def keystorePropertiesFile = rootProject.file("gradle.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See [https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle](https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle)
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Build variants, both driven by a -P flag rather than a product flavor so that the
 * default build stays exactly what it was.
 *
 *   ./gradlew assembleRelease                  ADB provisioning / manual install: everything on
 *   ./gradlew bundleRelease -Pplaystore        Play Store: no self-update, no accessibility
 *   ./gradlew assembleRelease -Pcloudprovi     QR provisioning: self-update kept, accessibility stripped
 *
 * -Pcloudprovi exists because Play Protect blocks a sideloaded install outright when the
 * app declares an accessibility service, which is how the setup wizard installs the DPC
 * during QR provisioning. It strips that service and nothing else - a provisioning APK
 * still needs REQUEST_INSTALL_PACKAGES. See src/cloudprovi/AndroidManifest.xml.
 */
if (project.hasProperty('playstore') && project.hasProperty('cloudprovi')) {
    throw new GradleException(
        "-Pplaystore and -Pcloudprovi are mutually exclusive: they select different " +
        "manifest overlays. Play Store builds strip self-update, provisioning builds need it."
    )
}

def enableSelfUpdate = !project.hasProperty('playstore')
def enableAccessibilityService = !project.hasProperty('playstore') && !project.hasProperty('cloudprovi')

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def hermesEnabled = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.freekiosk"
    defaultConfig {
        applicationId "com.freekiosk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "2.1.0-beta.1"

        // Expose self-update flag to both Kotlin (BuildConfig) and JS (via UpdateModule constants)
        buildConfigField "boolean", "ENABLE_SELF_UPDATE", "${enableSelfUpdate}"

        // inDiKo: the CI build (tag such as v2.1.0-beta.1-qr10), sent in the status so the
        // kit can tell builds apart; versionName stays the same for all of them
        def kitBuild = (project.findProperty('kitBuild') ?: '').toString().replaceAll(/[^A-Za-z0-9._-]/, '')
        buildConfigField "String", "KIT_BUILD", "\"${kitBuild}\""

        // Play Store compliance: when -Pplaystore is set, replace REQUEST_INSTALL_PACKAGES
        // with INTERNET (already declared → deduplicated by manifest merger → effectively removed)
        // and disable UpdateInstallReceiver.
        //
        // The two flags move independently: -Pcloudprovi keeps self-update and drops only
        // the accessibility service, so these cannot share one if/else.
        manifestPlaceholders = [
            usesCleartextTraffic: "true",
            updateReceiverEnabled: "${enableSelfUpdate}",
            accessibilityServiceEnabled: "${enableAccessibilityService}"
        ]
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists() && 
                keystoreProperties['FREEKIOSK_UPLOAD_STORE_FILE'] != null) {
                storeFile file(keystoreProperties['FREEKIOSK_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['FREEKIOSK_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['FREEKIOSK_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['FREEKIOSK_UPLOAD_KEY_PASSWORD']
            } else {
                // Use debug keystore as fallback
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    
    // Exclude duplicate META-INF files from HiveMQ MQTT client's Netty dependencies
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Play Store builds: merge an overlay manifest that uses tools:node="remove"
    // to completely strip FreeKioskAccessibilityService (and its BIND_ACCESSIBILITY_SERVICE
    // permission) from the final merged manifest — not just disable it.
    if (project.hasProperty('playstore')) {
        sourceSets {
            release {
                manifest.srcFile 'src/playstore/AndroidManifest.xml'
            }
        }
    } else if (project.hasProperty('cloudprovi')) {
        sourceSets {
            release {
                manifest.srcFile 'src/cloudprovi/AndroidManifest.xml'
            }
        }
    }
}

// ---------------------------------------------------------------------------------------
// inDiKo: built-in offline voices, the sherpa-onnx speech library (Apache 2.0), native part only.
// Its Kotlin side is android/app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt, copied from the
// same version, because the JNI code reads those classes by name. The AAR is fetched once per
// build and checked against its SHA-256; only arm64-v8a (Galaxy Tab A9+ and every tablet of the
// last years) goes into the APK, which keeps it about 20 MB larger instead of 80 MB. Elsewhere
// the built-in voices report "not available" and Samsung/Google voices still work.
// -PnoSherpa builds without it (no internet), with the same fallback.
// ---------------------------------------------------------------------------------------
def sherpaVersion = "1.12.21"
def sherpaSha256 = "4ce353cda9ab9e4c2e398dfd45aeb43cca1b5f97279051d354ebcdbd043e74ef"
def sherpaUrl = "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-${sherpaVersion}.aar"
def sherpaAbis = ["arm64-v8a"]
def sherpaDir = new File(layout.buildDirectory.get().asFile, "sherpa-onnx")
def sherpaJniDir = new File(sherpaDir, "jniLibs")

def sha256Of = { File f ->
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { is ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

task prepareSherpaOnnx {
    description = "Fetches the sherpa-onnx native libraries for the built-in offline voices"
    inputs.property("sherpaVersion", sherpaVersion)
    inputs.property("sherpaAbis", sherpaAbis.join(","))
    outputs.dir(sherpaJniDir)
    onlyIf { !project.hasProperty('noSherpa') }
    doLast {
        sherpaDir.mkdirs()
        def aar = new File(sherpaDir, "sherpa-onnx-${sherpaVersion}.aar")
        if (!aar.exists() || sha256Of(aar) != sherpaSha256) {
            def tmp = new File(sherpaDir, "download.tmp")
            println "[sherpa-onnx] Downloading ${sherpaUrl}"
            def conn = new URL(sherpaUrl).openConnection()
            conn.setRequestProperty("User-Agent", "freekiosk-build")
            conn.setConnectTimeout(30000)
            conn.setReadTimeout(120000)
            conn.inputStream.withStream { input -> tmp.withOutputStream { out -> out << input } }
            def got = sha256Of(tmp)
            if (got != sherpaSha256) {
                tmp.delete()
                throw new GradleException("sherpa-onnx AAR checksum mismatch: got ${got}, expected ${sherpaSha256}")
            }
            aar.delete()
            if (!tmp.renameTo(aar)) throw new GradleException("Cannot move ${tmp} to ${aar}")
        }
        project.delete(sherpaJniDir)
        sherpaAbis.each { abi ->
            project.copy {
                // libc++_shared.so comes with React Native already; a second copy would clash
                from(project.zipTree(aar)) { include "jni/${abi}/*.so"; exclude "**/libc++_shared.so" }
                into sherpaJniDir
                eachFile { details -> details.path = details.path.substring("jni/".length()) }
                includeEmptyDirs = false
            }
            def jni = new File(sherpaJniDir, "${abi}/libsherpa-onnx-jni.so")
            if (!jni.isFile()) {
                def names = project.zipTree(aar).files.collect { it.name }.unique().sort().join(", ")
                throw new GradleException("sherpa-onnx AAR has no ${abi}/libsherpa-onnx-jni.so (files: ${names})")
            }
        }
        println "[sherpa-onnx] Native libraries ready: " + sherpaJniDir.listFiles().collect { d -> d.name + "/" + d.list().join("+") }.join(", ")
    }
}

android {
    sourceSets {
        main {
            jniLibs.srcDir(sherpaJniDir)
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn prepareSherpaOnnx }

// Fix autolinking bug where react-native-screens incorrectly registers RNSSafeAreaViewComponentDescriptor
task fixAutolinkingBug {
    doLast {
        def autolinkingFile = file("build/generated/autolinking/src/main/jni/autolinking.cpp")
        if (autolinkingFile.exists()) {
            def content = autolinkingFile.text
            def fixed = content.replace('RNSSafeAreaViewComponentDescriptor', 'RNCSafeAreaViewComponentDescriptor')
            if (content != fixed) {
                autolinkingFile.text = fixed
                println "[FreeKiosk] Fixed autolinking bug: RNSSafeAreaViewComponentDescriptor -> RNCSafeAreaViewComponentDescriptor"
            }
        }
    }
}

// Run fix before any CMake build task
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('buildCMake')) {
        task.dependsOn fixAutolinkingBug
    }
}

// React Native Vector Icons configuration
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.mediarouter:mediarouter:1.8.1")

    // NanoHTTPD for REST API server
    implementation("org.nanohttpd:nanohttpd:2.3.1")

    // HiveMQ MQTT Client for Home Assistant integration
    implementation("com.hivemq:hivemq-mqtt-client:1.3.12")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

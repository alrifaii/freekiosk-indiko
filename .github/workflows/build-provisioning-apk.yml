name: Build provisioning APK and QR kit

# Builds the -Pcloudprovi variant (no accessibility service, so Play Protect lets the
# setup wizard install it) and packs it with tools/provisioning-kit into a ZIP that IT
# staff unpack and start with Start.bat.
#
# Run it by hand from the Actions tab (result under "Artifacts"), or push a tag such as
# v2.0.0-beta.6-qr1 to also publish APK and ZIP as a release. The release link of the APK
# is a stable download URL for the QR code.
#
# Signing: set the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD. Without them the APK is signed with the public debug key from the repo,
# which is fine for a first test but must not be used on real devices: anyone holding
# that key could push an "update" of FreeKiosk to them.

on:
  workflow_dispatch:
  push:
    tags: ['v*-qr*']

permissions:
  contents: write

jobs:
  test-kit-windows:
    # The kit's server runs on school laptops with Windows PowerShell 5.1 and no
    # installs, so it is tested there and not only on Linux.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: tools/provisioning-kit
    steps:
      - uses: actions/checkout@v4

      - name: Start server.ps1 with a dummy APK
        run: |
          [System.IO.File]::WriteAllBytes("$PWD\dummy.apk", [byte[]](1..200))
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','server.ps1','-NoBrowser','-Port','18080' -RedirectStandardOutput server.log -RedirectStandardError server.err
          Start-Sleep -Seconds 5
          Get-Content server.log, server.err -ErrorAction SilentlyContinue

      - name: Check every route
        run: |
          $ErrorActionPreference = 'Stop'
          $info = Invoke-RestMethod http://localhost:18080/api/info
          if ($info.apkName -ne 'dummy.apk' -or $info.apkSize -ne 200) { throw "api/info wrong: $($info | ConvertTo-Json)" }
          $apk = Invoke-WebRequest http://localhost:18080/freekiosk.apk -UseBasicParsing
          if ($apk.RawContentLength -ne 200) { throw "APK length $($apk.RawContentLength)" }
          $page = Invoke-WebRequest http://localhost:18080/ -UseBasicParsing
          if ($page.Content -notmatch 'FreeKiosk QR-Kit') { throw 'index.html not served' }
          foreach ($f in 'qrcode.js', 'provisioning.js') {
            $r = Invoke-WebRequest "http://localhost:18080/$f" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "$f not served" }
          }
          try { Invoke-WebRequest 'http://localhost:18080/nope.txt' -UseBasicParsing | Out-Null; throw 'missing file did not 404' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          Write-Host 'All routes OK'
          Write-Host ($info | ConvertTo-Json -Depth 4)

      - name: Server log
        if: always()
        run: Get-Content server.log, server.err -ErrorAction SilentlyContinue

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies (applies patches/)
        run: npm ci

      - name: Gradle properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: signed with the public debug key. Test devices only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/provisioning-release.keystore
          {
            echo "FREEKIOSK_UPLOAD_STORE_FILE=provisioning-release.keystore"
            echo "FREEKIOSK_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FREEKIOSK_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "FREEKIOSK_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -Pcloudprovi --no-daemon

      - name: Pack APK and QR kit
        run: |
          REF="${GITHUB_REF_NAME//\//-}"
          APK_NAME="FreeKiosk-${REF}-provisioning.apk"
          KIT_DIR="FreeKiosk-QR-Kit-${REF}"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME"

          RELEASE_URL=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"
          fi

          cp -r tools/provisioning-kit "$KIT_DIR"
          cp "$APK_NAME" "$KIT_DIR/"
          printf '{"version":"%s","releaseUrl":"%s"}\n' "$GITHUB_REF_NAME" "$RELEASE_URL" > "$KIT_DIR/config.json"
          zip -r -q "${KIT_DIR}.zip" "$KIT_DIR"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "KIT_ZIP=${KIT_DIR}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeKiosk-QR-Kit
          path: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}
          prerelease: true
          body: |
            **FreeKiosk-QR-Kit** (ZIP): entpacken, `Start.bat` doppelklicken, QR-Codes erzeugen.
            Die APK ist die Provisioning-Variante (-Pcloudprovi) mit Einstellungen aus dem QR-Code.

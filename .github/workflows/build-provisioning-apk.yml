name: Build provisioning APK and inDiKo Kit

# inDiKo: builds FreeKiosk (the -Pcloudprovi variant: no accessibility service, so Play
# Protect lets the setup wizard install it) and packs the inDiKo Kit (tools/provisioning-kit)
# into a ZIP. The kit holds no APK: its QR code points the tablets to the APK of this
# release, and config.js carries the link and the APK's signature checksum.
#
# Run it by hand from the Actions tab (result under "Artifacts"), or push a tag such as
# v2.1.0-beta.1-qr11 to publish APK and ZIP as a release.
#
# Signing: set the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD. Without them the APK is signed with the public debug key from the repo,
# which is fine for a first test but must not be used on real devices: anyone holding
# that key could push an "update" of FreeKiosk to them.

on:
  workflow_dispatch:
  push:
    tags: ['v*-qr*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies (applies patches/)
        run: npm ci

      - name: Gradle properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: signed with the public debug key. Test devices only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/provisioning-release.keystore
          {
            echo "FREEKIOSK_UPLOAD_STORE_FILE=provisioning-release.keystore"
            echo "FREEKIOSK_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FREEKIOSK_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "FREEKIOSK_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build APK
        working-directory: android
        # The tag goes into the app (status device.build), so the kit shows which build runs
        run: |
          BUILD="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then BUILD="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"; fi
          ./gradlew assembleRelease -Pcloudprovi -PkitBuild="$BUILD" --no-daemon

      - name: Pack APK and kit
        run: |
          REF="${GITHUB_REF_NAME//\//-}"
          APK_NAME="FreeKiosk-${REF}-provisioning.apk"
          KIT_DIR="inDiKo-Kit-${REF}"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME"

          # Signature checksum for the QR code: SHA-256 of the signing certificate, base64url
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          DIGEST="$("$APKSIGNER" verify --print-certs "$APK_NAME" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          SIG="$(python3 -c 'import base64,sys; print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip("="))' "$DIGEST")"
          if [ "${#SIG}" != 43 ]; then echo "::error::No signature checksum (digest: '$DIGEST')"; exit 1; fi
          echo "Signature checksum: $SIG"

          APK_URL=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"
          fi

          cp -r tools/provisioning-kit "$KIT_DIR"
          cat > "$KIT_DIR/web/config.js" <<EOF
          // Written by the build for ${GITHUB_REF_NAME}
          window.KIT_CONFIG = {
            version: "${GITHUB_REF_NAME}",
            apkUrl: "${APK_URL}",
            signatureChecksum: "${SIG}",
          };
          EOF
          cat "$KIT_DIR/web/config.js"
          zip -r -q "${KIT_DIR}.zip" "$KIT_DIR"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "KIT_ZIP=${KIT_DIR}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: inDiKo-Kit
          path: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}
          prerelease: true
          body: |
            **inDiKo Kit** (ZIP): entpacken, `Start.bat` doppelklicken (oder `web/index.html` öffnen).
            Einrichten per QR-Code, Tablets live per MQTT steuern. Die Tablets laden die APK
            beim Einrichten selbst von hier.
            Die APK ist die Provisioning-Variante (-Pcloudprovi) mit Einstellungen aus dem QR-Code.

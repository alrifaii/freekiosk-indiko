name: Build provisioning APK and QR kit

# Builds the -Pcloudprovi variant (no accessibility service, so Play Protect lets the
# setup wizard install it) and packs it with tools/provisioning-kit into a ZIP that IT
# staff unpack and start with Start.bat.
#
# Run it by hand from the Actions tab (result under "Artifacts"), or push a tag such as
# v2.0.0-beta.6-qr1 to also publish APK and ZIP as a release. The release link of the APK
# is a stable download URL for the QR code.
#
# Signing: set the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD. Without them the APK is signed with the public debug key from the repo,
# which is fine for a first test but must not be used on real devices: anyone holding
# that key could push an "update" of FreeKiosk to them.

on:
  workflow_dispatch:
  push:
    tags: ['v*-qr*']

permissions:
  contents: write

jobs:
  test-kit-windows:
    # The kit's server runs on school laptops with Windows PowerShell 5.1 and no
    # installs, so it is tested there and not only on Linux.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: tools/provisioning-kit
    steps:
      - uses: actions/checkout@v4

      - name: Start server.ps1 and check every route
        # Start and checks share one step, so a failure can only mean the server.
        run: |
          $ErrorActionPreference = 'Stop'
          [System.IO.File]::WriteAllBytes("$PWD\dummy.apk", [byte[]](1..200))
          $proc = Start-Process powershell -PassThru -WorkingDirectory $PWD `
            -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$PWD\server.ps1",'-NoBrowser','-Port','18080' `
            -RedirectStandardOutput "$PWD\server.log" -RedirectStandardError "$PWD\server.err"

          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) {
            Start-Sleep -Milliseconds 500
            if ($proc.HasExited) { break }
            try { $c = New-Object System.Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 18080); $c.Close(); $up = $true } catch { }
          }
          Get-Content "$PWD\server.log", "$PWD\server.err" -ErrorAction SilentlyContinue
          if (-not $up) { throw "Server not reachable on 127.0.0.1:18080 (process exited: $($proc.HasExited))" }

          function Test-Kit([string]$base) {
            $info = Invoke-RestMethod "$base/api/info"
            if ($info.apkName -ne 'dummy.apk' -or $info.apkSize -ne 200) { throw "$base api/info wrong: $($info | ConvertTo-Json)" }
            $apk = Invoke-WebRequest "$base/freekiosk.apk" -UseBasicParsing
            if ($apk.RawContentLength -ne 200) { throw "$base APK length $($apk.RawContentLength)" }
            $page = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($page.Content -notmatch 'FreeKiosk QR-Kit') { throw "$base index.html not served" }
            foreach ($f in 'qrcode.js', 'provisioning.js') {
              $r = Invoke-WebRequest "$base/$f" -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$base $f not served" }
            }
            $missing = $null
            try { Invoke-WebRequest "$base/nope.txt" -UseBasicParsing | Out-Null } catch { $missing = $_.Exception.Response.StatusCode.value__ }
            if ($missing -ne 404) { throw "$base missing file gave $missing instead of 404" }
            Write-Host "OK  $base"
            return $info
          }

          $info = Test-Kit 'http://127.0.0.1:18080'
          Test-Kit 'http://localhost:18080' | Out-Null
          # The address a tablet would use
          $lan = @($info.ips | Where-Object { $_.address })[0].address
          if ($lan) { Test-Kit "http://${lan}:18080" | Out-Null }
          Write-Host ($info | ConvertTo-Json -Depth 4)
          Stop-Process -Id $proc.Id -Force

      - name: Server log
        if: always()
        run: Get-Content server.log, server.err -ErrorAction SilentlyContinue

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies (applies patches/)
        run: npm ci

      - name: Gradle properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: signed with the public debug key. Test devices only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/provisioning-release.keystore
          {
            echo "FREEKIOSK_UPLOAD_STORE_FILE=provisioning-release.keystore"
            echo "FREEKIOSK_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FREEKIOSK_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "FREEKIOSK_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -Pcloudprovi --no-daemon

      - name: Pack APK and QR kit
        run: |
          REF="${GITHUB_REF_NAME//\//-}"
          APK_NAME="FreeKiosk-${REF}-provisioning.apk"
          KIT_DIR="FreeKiosk-QR-Kit-${REF}"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME"

          RELEASE_URL=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"
          fi

          cp -r tools/provisioning-kit "$KIT_DIR"
          cp "$APK_NAME" "$KIT_DIR/"
          printf '{"version":"%s","releaseUrl":"%s"}\n' "$GITHUB_REF_NAME" "$RELEASE_URL" > "$KIT_DIR/config.json"
          zip -r -q "${KIT_DIR}.zip" "$KIT_DIR"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "KIT_ZIP=${KIT_DIR}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeKiosk-QR-Kit
          path: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.KIT_ZIP }}
            ${{ env.APK_NAME }}
          prerelease: true
          body: |
            **FreeKiosk-QR-Kit** (ZIP): entpacken, `Start.bat` doppelklicken, QR-Codes erzeugen.
            Die APK ist die Provisioning-Variante (-Pcloudprovi) mit Einstellungen aus dem QR-Code.
